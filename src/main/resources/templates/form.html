<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>URL Shortener</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
        }
        .shortener-box {
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="shortener-box text-center">
    <h2 class="mb-4">Masukkan URL</h2>
    <form th:action="@{/form}" method="post" class="mb-3">
        <div class="input-group">
            <input type="text" name="url" class="form-control" placeholder="Masukkan URL" required />
            <button type="submit" class="btn btn-primary">Shorten</button>
        </div>
    </form>

    <div th:if="${shortenedUrl}">
        <p class="mt-3">
            Shortened URL: <a th:href="${shortenedUrl}" th:text="${shortenedUrl}"></a>
        </p>
    </div>
</div>
</body>
</html>
